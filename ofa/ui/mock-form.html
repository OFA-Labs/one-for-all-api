<!doctype html><html lang="en"><head><meta charset="utf-8"><title>OFA Mock Application</title>
<style>body{font:15px "Segoe UI",sans-serif;background:#f6f7f9;margin:0}form{max-width:480px;margin:40px auto;background:#fff;padding:24px;border-radius:10px}
label{display:block;margin:12px 0 4px}input,select{width:100%;padding:8px;box-sizing:border-box}.err{color:#b91c1c;font-size:13px}.page{display:none}.page.on{display:block}button{margin-top:16px;padding:9px 16px}</style></head>
<body><form id="f" novalidate><h1>Mock application</h1>
<div class="page on" data-p="1"><h2>Step 1 of 3 · About you</h2>
<label for="name">Full name</label><input id="name" required>
<label for="phone">Mobile number</label><input id="phone" inputmode="tel" pattern="[0-9+ ]{10,15}" required><div class="err" id="perr"></div>
<label for="city">City</label><input id="city" required>
<button type="button" data-next>Next</button></div>
<div class="page" data-p="2"><h2>Step 2 of 3 · Work</h2>
<label for="emp">Currently employed?</label><select id="emp"><option value="">Choose…</option><option>Yes</option><option>No</option></select>
<div id="companyBox" hidden><label for="company">Company</label><input id="company"></div>
<label for="years">Years of experience</label><input id="years" type="number" min="0" max="60">
<button type="button" data-next>Next</button></div>
<div class="page" data-p="3"><h2>Step 3 of 3 · Declaration</h2>
<label for="pan">PAN (sensitive)</label><input id="pan" autocomplete="off">
<label><input type="checkbox" id="declare"> I declare the information is true (OFA must always ask you)</label>
<button type="submit">Submit application</button><div id="out" role="status"></div></div></form>
<script>
const pages=[...document.querySelectorAll(".page")];let i=0;
document.getElementById("emp").onchange=e=>document.getElementById("companyBox").hidden=e.target.value!=="Yes";
document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{
 if(i===0){const p=document.getElementById("phone");if(!p.checkValidity()){document.getElementById("perr").textContent="Enter a valid mobile number";return}document.getElementById("perr").textContent=""}
 pages[i].classList.remove("on");i++;pages[i].classList.add("on")});
document.getElementById("f").onsubmit=e=>{e.preventDefault();document.getElementById("out").textContent=document.getElementById("declare").checked?"Submitted (mock). Reference OFA-TEST-001":"Please confirm the declaration."};
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>OFA Mock Login</title>
<style>body{font:15px "Segoe UI",sans-serif;background:#f6f7f9;margin:0}form{max-width:360px;margin:60px auto;background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 10px #0001}
label{display:block;margin:12px 0 4px}input{width:100%;padding:8px;box-sizing:border-box}button{margin-top:16px;padding:9px 16px}#out{margin-top:12px;color:#065f46}</style></head>
<body><form id="f"><h1>Mock sign in</h1><p>Local test page. Nothing is sent anywhere.</p>
<label for="u">Username</label><input id="u" name="username" autocomplete="username">
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password">
<label><input type="checkbox" id="human"> I'm not a robot (human check — OFA hands this to you)</label>
<button type="submit">Sign in</button><div id="out" role="status"></div></form>
<script>document.getElementById("f").onsubmit=e=>{e.preventDefault();const ok=document.getElementById("p").value.length>0&&document.getElementById("human").checked;
document.getElementById("out").textContent=ok?"Signed in (mock)":"Fill the password and complete the human check."};</script></body></html>

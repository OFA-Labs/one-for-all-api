name: OFA core checks
on:
  pull_request:
    paths: ["ofa/**", "ofa_execution/**", "voice/**", "tests/ofa_core/**", "requirements-ofa.txt", ".github/workflows/ofa.yml"]
  push:
    branches: [staging]
    paths: ["ofa/**", "ofa_execution/**", "voice/**", "tests/ofa_core/**", "requirements-ofa.txt", ".github/workflows/ofa.yml"]
jobs:
  ofa:
    name: OFA unit tests (fake providers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ofa.txt
      - run: python -m pytest tests/ofa_core -q

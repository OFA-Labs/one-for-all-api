name: E-Brain checks (V3)

# Mandatory discovery gate. Pure tests always run. Postgres/RLS and live-model
# jobs are separate: if their secret/env is absent they are explicitly NOT_RUN
# and never counted as a green release gate.

on:
  workflow_dispatch:
  push:
    paths:
      - "ebrain/**"
      - "tests/**"
      - "tools/ebrain/**"
      - "migrations/**"
      - "docs/ebrain/**"
  pull_request:
    paths:
      - "ebrain/**"
      - "tests/**"
      - "tools/ebrain/**"
      - "migrations/**"
      - "docs/ebrain/**"

jobs:
  pure-and-legacy:
    name: Legacy compatibility + V3 pure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Legacy suite with retained CSV sources
        # Native voice dependencies/tests run in the dedicated Windows job.
        # Keep the existing backend coverage on Linux without importing audio.
        env:
          PYTEST_ADDOPTS: --ignore=tests/voice
        run: pwsh -NoProfile -File tools/ebrain/scripts/Test-CurrentBackend.ps1 -Python python
      - name: Frozen harness self-tests
        run: python -m pytest tools/ebrain/legacy/benchmark/tests -q
      - name: V3 pure and security tests
        run: python -m pytest tests/v3 --ignore=tests/v3/integration -q
      - name: Mandatory test-ID discovery
        run: python tools/ebrain/scripts/validate_v3_gate.py --python python --discover-only

  postgres-integration:
    name: Real Postgres / RLS / concurrency (NOT_RUN without secret)
    runs-on: ubuntu-latest
    needs: pure-and-legacy
    env:
      EBRAIN_V3_TEST_PG_DSN: ${{ secrets.EBRAIN_V3_TEST_PG_DSN }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: ebrain_v3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ebrain_v3_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install test-only driver
        run: pip install "psycopg[binary]==3.2.9"
      - name: Configure isolated DSN (value never echoed)
        if: env.EBRAIN_V3_TEST_PG_DSN == ''
        run: echo "EBRAIN_V3_TEST_PG_DSN=postgresql://postgres:synthetic-only@localhost:5432/ebrain_v3_test" >> "$GITHUB_ENV"
      - name: Apply migration and run integration suite
        run: python -m pytest tests/v3/integration -q
        env:
          EBRAIN_V3_TEST_PG_DSN: ${{ env.EBRAIN_V3_TEST_PG_DSN }}

  # Web checks run in the one-for-all-web repository CI (separate repo).
  # Observed web results are recorded in docs/ebrain/implementation-plan/evidence/M14-web-v3/.

  release-gate:
    name: Release gate (fails on any NOT_RUN mandatory case)
    runs-on: ubuntu-latest
    needs: [pure-and-legacy, postgres-integration]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Assert no mandatory case is missing or skipped
        run: python tools/ebrain/scripts/validate_v3_gate.py --python python
      - name: Fail if any prerequisite job is not successful
        env:
          PURE: ${{ needs.pure-and-legacy.result }}
          PG: ${{ needs.postgres-integration.result }}
          WEB: ${{ needs.web-v3.result }}
        run: |
          test "$PURE" = "success"
          test "$PG" = "success" || { echo "Postgres job NOT_RUN/FAILED: release gate blocked"; exit 2; }

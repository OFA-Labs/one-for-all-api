name: E-Brain checks (V3)

# Mandatory discovery gate. Pure tests always run. Postgres/RLS runs against a
# disposable service database in BOTH the integration and release-gate jobs:
# tools/ebrain/scripts/ci_prepare_pg.py creates synthetic restricted roles,
# applies the pinned migration and exports the migration/runtime DSNs. If that
# preparation cannot run, the job fails instead of silently skipping tests.
# Web checks run in the web-v3 job below against one-for-all-web@staging; observed
# results are recorded in docs/ebrain/implementation-plan/evidence/M14-web-v3/.

on:
  workflow_dispatch:
  push:
    paths:
      - "ebrain/**"
      - "tests/**"
      - "tools/ebrain/**"
      - "migrations/**"
      - "docs/ebrain/**"
  pull_request:
    paths:
      - "ebrain/**"
      - "tests/**"
      - "tools/ebrain/**"
      - "migrations/**"
      - "docs/ebrain/**"

jobs:
  pure-and-legacy:
    name: Legacy compatibility + V3 pure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out web repo for bridge contract tests
        uses: actions/checkout@v4
        with:
          repository: OFA-Labs/one-for-all-web
          ref: staging
          path: web-checkout
      - name: Expose web checkout at the sibling path used by the tests
        run: ln -s "$GITHUB_WORKSPACE/web-checkout" "$GITHUB_WORKSPACE/../one-for-all-web"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Provide the venv path expected by the shipped agent hooks
        run: |
          mkdir -p .venv/Scripts
          ln -sf "$(command -v python)" .venv/Scripts/python.exe
      - name: Legacy suite with retained CSV sources
        # Native voice dependencies/tests run in the dedicated Windows job.
        # Keep the existing backend coverage on Linux without importing audio.
        env:
          PYTEST_ADDOPTS: --ignore=tests/voice
        run: pwsh -NoProfile -File tools/ebrain/scripts/Test-CurrentBackend.ps1 -Python python
      - name: Frozen harness self-tests
        run: python -m pytest tools/ebrain/legacy/benchmark/tests -q
      - name: V3 pure and security tests
        run: python -m pytest tests/v3 --ignore=tests/v3/integration -q
      - name: Mandatory test-ID discovery
        run: python tools/ebrain/scripts/validate_v3_gate.py --python python --discover-only

  postgres-integration:
    name: Real Postgres / RLS / concurrency (disposable service)
    runs-on: ubuntu-latest
    needs: pure-and-legacy
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: ebrain_v3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ebrain_v3_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install test-only driver
        run: pip install "psycopg[binary]==3.2.9"
      - name: Prepare isolated Postgres roles and migration DSNs
        env:
          CI_PG_ADMIN_DSN: postgresql://postgres:synthetic-only@localhost:5432/ebrain_v3_test
        run: python tools/ebrain/scripts/ci_prepare_pg.py
      - name: Run the real Postgres / RLS / concurrency suite
        run: python -m pytest tests/v3/integration -q

  # Web V3 checks run against one-for-all-web@staging in the job below.
  # PAUSED: E-Brain work is on hold, so this job is skipped until the repo
  # variable ENABLE_WEB_V3_CHECKS is set to 'true'. It is not a release-gate
  # prerequisite while paused. Observed results are in
  # docs/ebrain/implementation-plan/evidence/M14-web-v3/.
  web-v3:
    name: Web V3 typecheck, lint, build and Playwright checks
    if: ${{ vars.ENABLE_WEB_V3_CHECKS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OFA-Labs/one-for-all-web
          ref: staging
          path: web-checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-checkout/package-lock.json
      - name: Install pinned web dependencies
        working-directory: web-checkout
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web-checkout
        env:
          # playwright.config.ts resolves browsers from ./.cache/ms-playwright,
          # so the install must use the same project-local cache path.
          PLAYWRIGHT_BROWSERS_PATH: ./.cache/ms-playwright
        run: npx playwright install --with-deps chromium
      - name: Run npm run verify (typecheck, lint, build, test)
        working-directory: web-checkout
        run: npm run verify

  release-gate:
    name: Release gate (fails on any NOT_RUN mandatory case)
    runs-on: ubuntu-latest
    needs: [pure-and-legacy, postgres-integration]
    if: always()
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: ebrain_v3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ebrain_v3_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install test-only driver
        run: pip install "psycopg[binary]==3.2.9"
      - name: Prepare isolated Postgres roles and migration DSNs
        env:
          CI_PG_ADMIN_DSN: postgresql://postgres:synthetic-only@localhost:5432/ebrain_v3_test
        run: python tools/ebrain/scripts/ci_prepare_pg.py
      - name: Assert no mandatory case is missing or skipped
        run: python tools/ebrain/scripts/validate_v3_gate.py --python python
      - name: Fail if any prerequisite job is not successful
        env:
          PURE: ${{ needs.pure-and-legacy.result }}
          PG: ${{ needs.postgres-integration.result }}
        run: |
          test "$PURE" = "success" || { echo "Pure/legacy job failed: release gate blocked"; exit 2; }
          test "$PG" = "success" || { echo "Postgres job NOT_RUN/FAILED: release gate blocked"; exit 2; }
          echo "Core E-Brain checks are green; Web V3 is paused (ENABLE_WEB_V3_CHECKS)."
